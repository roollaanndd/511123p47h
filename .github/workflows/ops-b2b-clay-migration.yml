name: One-shot - apply B2B clay customization migration

# Workflow operasional sementara: menjalankan migrasi v2.9.15 lewat Supabase
# Management API memakai repo secret. Tidak mencetak nilai secret. File ini
# akan dihapus setelah migrasi terverifikasi.

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration and verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          REF="${PROJECT_REF//[[:space:]]/}"
          API="https://api.supabase.com/v1/projects/${REF}/database/query"

          post_sql() {
            local file="$1" out="$2" code
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
              -d "$(jq -Rs '{query: .}' < "$file")")
            echo "$code"
          }

          MIG="supabase/migrations/20261119120000_b2b_clay_customization.sql"
          code=$(post_sql "$MIG" /tmp/mig.json)
          echo "::notice::migration_http=${code}"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Migration failed HTTP ${code}: $(head -c 800 /tmp/mig.json)"
            exit 1
          fi

          cat > /tmp/verify.sql <<'SQL'
          select table_name, column_name, data_type, column_default
          from information_schema.columns
          where table_schema = 'public'
            and table_name in ('sp_insurers', 'sp_b2b_plans')
            and column_name in ('accent_color', 'icon', 'sort_order', 'highlight_bullets', 'featured')
          order by table_name, column_name;
          SQL
          code=$(post_sql /tmp/verify.sql /tmp/verify.json)
          echo "::notice::verify_column_http=${code}"
          echo "::notice::verify_columns=$(jq -c . /tmp/verify.json | head -c 2000)"

          cat > /tmp/constraint.sql <<'SQL'
          select conname, pg_get_constraintdef(oid) as def
          from pg_constraint
          where conname like 'sp_insurers_%check' or conname like 'sp_b2b_plans_%check'
          order by conname;
          SQL
          code=$(post_sql /tmp/constraint.sql /tmp/constraint.json)
          echo "::notice::verify_constraint_http=${code}"
          echo "::notice::verify_constraints=$(jq -c . /tmp/constraint.json | head -c 1500)"
