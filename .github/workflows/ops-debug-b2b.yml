name: One-shot - debug B2B bulk batches

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read edge logs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          REF="${PROJECT_REF//[[:space:]]/}"
          SQL="SELECT timestamp, event_message FROM logs WHERE source_name = 'edge_logs' AND (event_message ILIKE '%b2b_bulk_list_batches%' OR event_message ILIKE '%b2b%' OR event_message ILIKE '%Unauthorized%' OR event_message ILIKE '%Forbidden%') ORDER BY timestamp DESC LIMIT 30"
          code=$(curl -sS -G -o /tmp/logs.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${REF}/analytics/endpoints/logs" \
            -H "Authorization: Bearer ${TOK}" \
            --data-urlencode "sql=${SQL}")
          echo "::notice::logs_http=${code}"
          echo "::notice::logs_body=$(head -c 14000 /tmp/logs.json | tr '\n' ' ')"
