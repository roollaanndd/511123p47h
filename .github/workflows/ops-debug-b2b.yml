name: One-shot - debug B2B bulk batches

# Diagnostik sementara: baca log edge function dan cek tabel B2B lewat
# Management API. Tidak mencetak nilai secret. Dihapus setelah selesai.

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints and database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          REF="${PROJECT_REF//[[:space:]]/}"

          probe() {
            local label="$1" url="$2" method="$3" body="${4:-}"
            local code out
            out=/tmp/probe-${label}.json
            if [ -n "$body" ]; then
              code=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
                -d "$body")
            else
              code=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer ${TOK}")
            fi
            echo "::notice::probe_${label}_http=${code}"
            echo "::notice::probe_${label}_body=$(head -c 1200 "$out" | tr '\n' ' ')"
          }

          probe logs_named "https://api.supabase.com/v1/projects/${REF}/functions/data-gateway/logs" GET
          probe logs_analytics "https://api.supabase.com/v1/projects/${REF}/analytics/endpoints/logs.all?sql=select%20*%20from%20edge_logs%20order%20by%20timestamp%20desc%20limit%2020" GET

          q() {
            local label="$1" sql="$2" code out
            out=/tmp/q-${label}.json
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
              -d "$(printf '%s' "$sql" | jq -Rs '{query: .}')")
            echo "::notice::q_${label}_http=${code}"
            echo "::notice::q_${label}_body=$(head -c 1200 "$out" | tr '\n' ' ')"
          }

          q batch_count "select count(*)::int as total, max(created_at) as latest from public.sp_b2b_batches;"
          q item_count "select count(*)::int as total from public.sp_b2b_batch_items;"
          q batch_cols "select column_name, data_type from information_schema.columns where table_schema='public' and table_name='sp_b2b_batches' order by ordinal_position;"
