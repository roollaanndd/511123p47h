name: One-shot - debug B2B bulk batches

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          REF="${PROJECT_REF//[[:space:]]/}"

          q() {
            local label="$1" sql="$2" code out
            out=/tmp/q-${label}.json
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
              -d "$(printf '%s' "$sql" | jq -Rs '{query: .}')")
            echo "::notice::q_${label}_http=${code}"
            echo "::notice::q_${label}_body=$(head -c 3000 "$out" | tr '\n' ' ')"
          }

          q b2b_profiles "select s.id, s.email, s.role, s.verified, s.created_at, u.id as auth_id, u.email_confirmed_at from public.sp_users s left join auth.users u on u.id = s.id or lower(u.email) = lower(s.email) where s.role = 'B2B_CLIENT' order by s.created_at;"
          q b2b_policies "select count(*)::int as total from public.sp_b2b_batches;"
