name: One-shot - debug B2B bulk batches

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe RLS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          REF="${PROJECT_REF//[[:space:]]/}"

          q() {
            local label="$1" sql="$2" code out
            out=/tmp/q-${label}.json
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${REF}/database/query" \
              -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
              -d "$(printf '%s' "$sql" | jq -Rs '{query: .}')")
            echo "::notice::q_${label}_http=${code}"
            echo "::notice::q_${label}_body=$(head -c 5000 "$out" | tr '\n' ' ')"
          }

          q rls "select schemaname, tablename, policyname, cmd, roles::text, qual, with_check from pg_policies where tablename in ('sp_b2b_submissions','sp_b2b_quotes','sp_b2b_batches') order by tablename, policyname;"
          q counts "select 'sp_b2b_submissions' t, count(*)::int n from public.sp_b2b_submissions union all select 'sp_b2b_quotes', count(*)::int from public.sp_b2b_quotes union all select 'sp_b2b_batches', count(*)::int from public.sp_b2b_batches;"
